<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Povídání — Michal Tvaroh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>
  (function(){
    try{
      var s=localStorage.getItem('theme');
      var t=s||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
      document.documentElement.setAttribute('data-theme',t);
    }catch(e){document.documentElement.setAttribute('data-theme','light');}
  })();
</script>
</head>
<body>

<header>
  <div class="bar">
    <a class="home" href="/">← Michal Tvaroh</a>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Přepnout tmavý režim" aria-pressed="false">
      <span class="ti-sun" aria-hidden="true">☀</span><span class="ti-moon" aria-hidden="true">☾</span>
    </button>
  </div>
</header>

<main class="wrap">
  <article class="single" id="single">
    <a class="back" href="/yapping">← Povídání</a>
    <p class="empty" id="loading">Načítám…</p>
  </article>
</main>

<footer>
  <div class="wrap footrow">
    <a class="mono" href="/">© 2026 Michal Tvaroh</a>
    <a class="mono" href="/yapping">Všechny příspěvky</a>
  </div>
</footer>

<script>
  const root=document.documentElement, toggle=document.getElementById('themeToggle');
  const sync=()=>toggle.setAttribute('aria-pressed', root.getAttribute('data-theme')==='dark');
  sync();
  toggle.addEventListener('click', ()=>{
    const next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('theme', next); }catch(e){}
    sync();
  });

  const fmtFull = new Intl.DateTimeFormat('cs-CZ', {day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const article = document.getElementById('single');
  const id = location.pathname.split('/').filter(Boolean).pop();

  function show(post){
    document.getElementById('loading')?.remove();
    const t=document.createElement('time');
    t.dateTime=post.created_at;
    t.textContent=fmtFull.format(new Date(post.created_at));

    const c=document.createElement('div');
    c.className='content'; c.textContent=post.content;

    article.append(t, c);

    if(post.updated_at && post.updated_at !== post.created_at){
      const e=document.createElement('div');
      e.className='edited';
      e.textContent='Upraveno '+fmtFull.format(new Date(post.updated_at));
      article.appendChild(e);
    }
  }

  function fail(msg){
    document.getElementById('loading')?.remove();
    const p=document.createElement('p'); p.className='empty'; p.textContent=msg;
    article.appendChild(p);
  }

  if(!/^\d+$/.test(id||'')){ fail('Příspěvek nenalezen.'); }
  else {
    fetch('/api/posts/'+id).then(r=>{
      if(r.status===404) throw new Error('404');
      return r.json();
    }).then(d=>show(d.post)).catch(e=>{
      fail(e.message==='404' ? 'Příspěvek nenalezen.' : 'Příspěvek se nepodařilo načíst.');
    });
  }
</script>

</body>
</html>
